    <script>
      // Filter benign Vite websocket disconnection error in cloud container where HMR is disabled
      (function() {
        var origError = console.error;
        console.error = function() {
          var msg = arguments && arguments[0] ? String(arguments[0]) : '';
          if (msg.indexOf('[vite]') !== -1) {
            return;
          }
          origError.apply(console, arguments);
        };
      })();
    </script>
