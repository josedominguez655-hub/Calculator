name: Build Windows Application (.exe)

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract source code
        shell: bash
        run: |
          if [ -f "resurrection-calculator-source.zip" ]; then
            unzip -o resurrection-calculator-source.zip
          elif [ -f "source.zip" ]; then
            unzip -o source.zip
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Web App
        shell: bash
        run: |
          npm install
          npm run build

      - name: Create Windows App Wrapper
        shell: bash
        run: |
          mkdir -p win-build/dist

          # Copiamos la app compilada
          if [ -d "dist" ]; then
            cp -r dist/. win-build/dist/
          elif [ -d "build" ]; then
            cp -r build/. win-build/dist/
          fi

          # Creamos el archivo principal de Electron automáticamente
          cat > win-build/main.js << 'EOF'
          const { app, BrowserWindow } = require('electron');
          const path = require('path');

          function createWindow() {
            const win = new BrowserWindow({
              width: 1000,
              height: 800,
              autoHideMenuBar: true,
              webPreferences: {
                nodeIntegration: true
              }
            });
            win.loadFile(path.join(__dirname, 'dist', 'index.html'));
          }

          app.whenReady().then(createWindow);

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') {
              app.quit();
            }
          });

          app.on('activate', () => {
            if (BrowserWindow.getAllWindows().length === 0) {
              createWindow();
            }
          });
          EOF

          # Creamos el package.json de la app de escritorio
          cat > win-build/package.json << 'EOF'
          {
            "name": "resurrection-calculator",
            "productName": "Resurrection Calculator",
            "version": "1.0.0",
            "description": "Resurrection Calculator",
            "author": "Jose",
            "main": "main.js",
            "devDependencies": {
              "electron": "^30.0.0",
              "electron-builder": "^24.13.3"
            },
            "build": {
              "appId": "com.resurrection.calculator",
              "productName": "Resurrection Calculator",
              "directories": {
                "output": "release"
              },
              "win": {
                "target": "portable"
              },
              "files": [
                "main.js",
                "dist/**/*"
              ]
            }
          }
          EOF

      - name: Build .exe
        shell: bash
        working-directory: ./win-build
        run: |
          npm install
          npx electron-builder build --win portable

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Resurrection-Calculator-Windows
          path: win-build/release/*.exe
