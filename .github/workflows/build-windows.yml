name: Build Windows Application (.exe)

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies and build Electron-ready web app
        shell: bash
        run: |
          npm install
          npm run build:web

      - name: Create isolated Electron wrapper
        shell: bash
        run: |
          set -e
          mkdir -p win-build
          cp -r dist win-build/dist

          cat > win-build/main.js << 'EOF'
          const { app, BrowserWindow } = require('electron');
          const path = require('path');

          function createWindow() {
            const win = new BrowserWindow({
              width: 1100,
              height: 800,
              autoHideMenuBar: true,
              webPreferences: {
                sandbox: true,
                nodeIntegration: false,
                contextIsolation: true,
              },
            });
            win.loadFile(path.join(__dirname, 'dist', 'index.html'));
          }

          app.whenReady().then(createWindow);

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });

          app.on('activate', () => {
            if (BrowserWindow.getAllWindows().length === 0) createWindow();
          });
          EOF

          cat > win-build/package.json << 'EOF'
          {
            "name": "resurrection-calculator",
            "productName": "Resurrection Calculator",
            "version": "1.0.0",
            "description": "Resurrection Calculator desktop app",
            "author": "Jose",
            "private": true,
            "main": "main.js",
            "build": {
              "appId": "com.jose.resurrectioncalculator",
              "electronDist": "node_modules/electron/dist",
              "npmRebuild": false,
              "directories": {
                "output": "release"
              },
              "files": [
                "main.js",
                "dist/**/*"
              ],
              "win": {
                "target": [
                  "portable"
                ]
              }
            },
            "devDependencies": {
              "electron": "44.5.1",
              "electron-builder": "^26.0.0"
            }
          }
          EOF

      - name: Install Electron and electron-builder
        shell: bash
        working-directory: ./win-build
        run: npm install

      - name: Package portable Windows executable
        shell: bash
        working-directory: ./win-build
        run: npx electron-builder --win portable --x64

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Resurrection-Calculator-Windows
          path: win-build/release/*.exe
