name: Build Windows Application (.exe)

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract zip package if uploaded
        shell: bash
        run: |
          if [ -f "resurrection-calculator-source.zip" ]; then
            echo "Found source! Extracting..."
            unzip -o resurrection-calculator-source.zip
          elif [ -f "source.zip" ]; then
            echo "Found source! Extracting..."
            unzip -o source.zip
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fix package.json for Windows
        shell: bash
        run: |
          npm pkg set description="Resurrection Calculator Application"
          npm pkg set author="Jose"
          npm pkg set main="electron/main.cjs"

      - name: Install dependencies
        shell: bash
        run: |
          npm install --legacy-peer-deps || npm install
          npm install electron electron-builder --save-dev

      - name: Build Web App
        shell: bash
        run: npm run build

      - name: Create Configuration File
        shell: bash
        run: |
          cat <<EOF > electron-builder.json
          {
            "appId": "com.resurrection.calculator",
            "productName": "Resurrection Calculator",
            "directories": {
              "output": "release"
            },
            "win": {
              "target": ["portable", "nsis"]
            },
            "files": [
              "dist/**/*",
              "electron/**/*",
              "package.json"
            ]
          }
          EOF

      - name: Package Windows Executable (.exe)
        shell: bash
        run: npx electron-builder build --win --config electron-builder.json

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Resurrection-Calculator-Windows-x64
          path: release/*.exe
