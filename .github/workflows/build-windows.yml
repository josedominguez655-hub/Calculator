name: Build Windows Application (.exe)

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies and build web app
        shell: bash
        run: |
          npm install
          npm run build

      - name: Create isolated Electron wrapper
        shell: bash
        run: |
          set -e
          mkdir -p win-build
          cp -r dist win-build/dist

          cat > win-build/main.js << 'EOF'
          const { app, BrowserWindow } = require('electron');
          const path = require('path');

          function createWindow() {
            const win = new BrowserWindow({
              width: 1100,
              height: 800,
              autoHideMenuBar: true,
              webPreferences: {
                nodeIntegration: false,
                contextIsolation: true,
              },
            });
            win.loadFile(path.join(__dirname, 'dist', 'index.html'));
          }

          app.whenReady().then(createWindow);

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });

          app.on('activate', () => {
            if (BrowserWindow.getAllWindows().length === 0) createWindow();
          });
          EOF

          cat > win-build/package.json << 'EOF'
          {
            "name": "resurrection-calculator",
            "productName": "Resurrection Calculator",
            "version": "1.0.0",
            "description": "Resurrection Calculator desktop app",
            "author": "Jose",
            "private": true,
            "main": "main.js"
          }
          EOF

      - name: Install Electron and Packager (no code-signing tools involved)
        shell: bash
        working-directory: ./win-build
        run: npm install --no-save electron@30 @electron/packager@18

      - name: Package portable Windows app
        shell: bash
        working-directory: ./win-build
        run: |
          npx electron-packager . "Resurrection Calculator" \
            --platform=win32 \
            --arch=x64 \
            --out=release \
            --overwrite \
            --asar

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Resurrection-Calculator-Windows
          path: win-build/release/**
