name: Build Windows Application (.exe)

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract source code
        shell: bash
        run: |
          if [ -f "resurrection-calculator-source.zip" ]; then
            unzip -o resurrection-calculator-source.zip
          elif [ -f "source.zip" ]; then
            unzip -o source.zip
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Web App
        shell: bash
        run: |
          npm install
          npm run build

      - name: Create Clean Windows Environment
        shell: bash
        run: |
          mkdir win-build
          cp -r dist win-build/
          cp -r electron win-build/
          cp -r public win-build/
          cat <<EOF > win-build/package.json
          {
            "name": "resurrection-calculator",
            "productName": "Resurrection Calculator",
            "version": "1.0.0",
            "description": "Calculator",
            "main": "electron/main.cjs",
            "author": "Jose",
            "devDependencies": {
              "electron": "^30.0.0",
              "electron-builder": "^24.13.3"
            },
            "build": {
              "appId": "com.resurrection.calculator",
              "directories": {
                "output": "release"
              },
              "win": {
                "target": "portable"
              }
            }
          }
          EOF

      - name: Build .exe
        shell: bash
        working-directory: ./win-build
        run: |
          npm install
          npx electron-builder build --win portable

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Resurrection-Calculator-Windows-x64
          path: win-build/release/*.exe
