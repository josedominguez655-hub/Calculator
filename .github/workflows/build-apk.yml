name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract zip package if uploaded
        run: |
          if [ -f "resurrection-calculator-source.zip" ]; then
            echo "Found resurrection-calculator-source.zip! Overwriting repository files with full latest version..."
            unzip -o resurrection-calculator-source.zip
          elif [ -f "source.zip" ]; then
            echo "Found source.zip! Overwriting repository files with full latest version..."
            unzip -o source.zip
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps || npm install

      - name: Build Web App
        run: npm run build

      - name: Setup Capacitor & Sync Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -f "capacitor.config.json" ]; then
            echo '{"appId":"com.resurrection.calculator","appName":"Resurrection Calculator","webDir":"dist","server":{"androidScheme":"https"}}' > capacitor.config.json
          fi
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Resurrection-Calculator.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
